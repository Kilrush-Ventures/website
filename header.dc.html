<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  a { text-decoration: none; }
  @media (max-width: 720px) {
    .site-nav { display: none !important; }
    .menu-btn { display: flex !important; }
  }
</style>
</helmet>

<header style="position:sticky; top:0; zIndex:50; background:rgba(241,237,230,0.92); backdropFilter:blur(16px); borderBottom:1px solid rgba(26,28,24,0.1); fontFamily:'Manrope', system-ui, sans-serif">
  <div style="maxWidth:1280px; margin:0 auto; padding:14px clamp(18px,4vw,32px); display:flex; alignItems:center; gap:20px">
    <a href="index.html" style="display:flex; alignItems:center; gap:12px; flex:0 0 auto; color:#1A1C18">
      <span style="width:30px; height:22px; display:block; position:relative">
        <span style="position:absolute; left:0; right:0; bottom:0; height:13px; border:1.5px solid #1A1C18; borderRadius:2px; display:block"></span>
        <span style="position:absolute; left:-1px; right:-1px; top:0; height:10px; borderBottom:1.5px solid #A98750; transform:skewY(-9deg); display:block"></span>
      </span>
      <span style="font-family:'Newsreader', Georgia, serif; fontWeight:600; letterSpacing:0.01em; fontSize:21px">Kilrush Ventures</span>
    </a>
    <nav className="site-nav" style="marginLeft:auto; display:flex; gap:clamp(10px,2vw,26px); alignItems:center; fontSize:13px; fontWeight:500; letterSpacing:0.06em; textTransform:uppercase; color:#54574E; flexWrap:wrap">
      <a href="range/" style="color:{{ rangeFg }}; background:{{ rangeBg }}; padding:{{ tabPad }}; borderRadius:2px" style-hover="color:#1A1C18">Range</a>
      <a href="showroom/" style="color:{{ showroomFg }}; background:{{ showroomBg }}; padding:{{ tabPad }}; borderRadius:2px" style-hover="color:#1A1C18">Showroom</a>
      <a href="planning/" style="color:{{ planningFg }}; background:{{ planningBg }}; padding:{{ tabPad }}; borderRadius:2px" style-hover="color:#1A1C18">Planning</a>
      <a href="faq/" style="color:{{ faqFg }}; background:{{ faqBg }}; padding:{{ tabPad }}; borderRadius:2px" style-hover="color:#1A1C18">FAQ</a>
      <a href="visit/" style="background:#A9603F; color:#FAF3EA; padding:11px 20px; borderRadius:2px; fontSize:12px; fontWeight:500; letterSpacing:0.1em" style-hover="background:#7A3F26; color:#FAF3EA">Visit</a>
    </nav>
    <button type="button" className="menu-btn" onClick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" aria-expanded="{{ menuOpen }}" style="display:none; marginLeft:auto; width:40px; height:40px; border:0; background:transparent; cursor:pointer; flexDirection:column; alignItems:center; justifyContent:center; gap:5px; flex:0 0 auto">
      <span style="width:22px; height:1.5px; background:#1A1C18; display:block; transition:transform .2s; transform:{{ bar1 }}"></span>
      <span style="width:22px; height:1.5px; background:#1A1C18; display:block; transition:opacity .2s; opacity:{{ bar2Op }}"></span>
      <span style="width:22px; height:1.5px; background:#1A1C18; display:block; transition:transform .2s; transform:{{ bar3 }}"></span>
    </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="borderTop:1px solid rgba(26,28,24,0.1); background:#F1EDE6; padding:8px clamp(18px,4vw,32px) 18px; display:flex; flexDirection:column; fontSize:14.5px; fontWeight:500; letterSpacing:0.04em; textTransform:uppercase">
      <a href="range/" onClick="{{ closeMenu }}" style="color:{{ rangeFg2 }}; background:{{ rangeBg }}; padding:14px 6px; borderRadius:2px; borderBottom:1px solid rgba(26,28,24,0.08)">Range</a>
      <a href="showroom/" onClick="{{ closeMenu }}" style="color:{{ showroomFg2 }}; background:{{ showroomBg }}; padding:14px 6px; borderRadius:2px; borderBottom:1px solid rgba(26,28,24,0.08)">Showroom</a>
      <a href="planning/" onClick="{{ closeMenu }}" style="color:{{ planningFg2 }}; background:{{ planningBg }}; padding:14px 6px; borderRadius:2px; borderBottom:1px solid rgba(26,28,24,0.08)">Planning</a>
      <a href="faq/" onClick="{{ closeMenu }}" style="color:{{ faqFg2 }}; background:{{ faqBg }}; padding:14px 6px; borderRadius:2px; borderBottom:1px solid rgba(26,28,24,0.08)">FAQ</a>
      <a href="visit/" onClick="{{ closeMenu }}" style="background:#A9603F; color:#FAF3EA; padding:14px 6px; borderRadius:2px; marginTop:10px; textAlign:center">Visit</a>
    </nav>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };

  renderVals() {
    const path = (typeof window !== "undefined" ? window.location.pathname : "").toLowerCase();
    const isActive = (slug) => path.includes("/" + slug + "/");
    const style = (slug) => isActive(slug)
      ? { bg: "#23261F", fg: "#C9A96B" }
      : { bg: "transparent", fg: "#54574E" };
    const r = style("range"), sh = style("showroom"), pl = style("planning"), fq = style("faq");
    const open = this.state.menuOpen;
    return {
      tabPad: "11px 16px",
      rangeBg: r.bg, rangeFg: r.fg,
      showroomBg: sh.bg, showroomFg: sh.fg,
      planningBg: pl.bg, planningFg: pl.fg,
      faqBg: fq.bg, faqFg: fq.fg,
      rangeFg2: isActive("range") ? "#C9A96B" : "#1A1C18",
      showroomFg2: isActive("showroom") ? "#C9A96B" : "#1A1C18",
      planningFg2: isActive("planning") ? "#C9A96B" : "#1A1C18",
      faqFg2: isActive("faq") ? "#C9A96B" : "#1A1C18",
      menuOpen: open,
      menuLabel: open ? "Close menu" : "Open menu",
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      bar1: open ? "translateY(6.5px) rotate(45deg)" : "none",
      bar2Op: open ? 0 : 1,
      bar3: open ? "translateY(-6.5px) rotate(-45deg)" : "none"
    };
  }
}
</script>
</body>
</html>
