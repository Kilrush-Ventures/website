<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#F1EDE6;font-family:"Manrope",ui-sans-serif,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="map"></div>
<script>
(async function(){
  const HQ = [-8.96556, 52.83694];
  const el = document.getElementById('map');
  function fallback(){
    el.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:32px;background:#E6E0D5;box-sizing:border-box">'
      + '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A665F">Find us</div>'
      + '<div style="font-size:19px;line-height:1.5;color:#16211C">Block 4, Unit 5<br>Quin Road Business Park<br>Ennis, Co. Clare</div>'
      + '<a href="https://www.google.com/maps/search/?api=1&query=Quin+Road+Business+Park+Ennis+Co+Clare" target="_blank" rel="noopener" style="margin-top:6px;align-self:flex-start;background:#1A1C18;color:#F1EDE6;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;text-decoration:none">Open in Google Maps</a>'
      + '</div>';
  }

  function loadScript(src){
    return new Promise(function(res, rej){
      const t = document.createElement('script');
      t.src = src; t.crossOrigin = 'anonymous';
      t.onload = res; t.onerror = rej;
      document.head.appendChild(t);
    });
  }
  async function ensureLibs(){
    const deadline = Date.now() + 5000;
    while (Date.now() < deadline) {
      if (window.d3 && window.topojson) return true;
      await new Promise(r => setTimeout(r, 120));
    }
    const alts = [];
    if (!window.d3) alts.push(loadScript('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js'));
    if (!window.topojson) alts.push(loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js'));
    try { await Promise.all(alts); } catch (e) {}
    return !!(window.d3 && window.topojson);
  }

  let topo;
  const URL_50M = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json';
  if (!(await ensureLibs())) { fallback(); return; }

  const SOURCES = [
    URL_50M,
    'https://unpkg.com/world-atlas@2.0.2/countries-50m.json',
    'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json'
  ];
  const CACHE_KEY = 'kv-world-atlas-50m';
  try {
    const cached = sessionStorage.getItem(CACHE_KEY);
    if (cached) topo = JSON.parse(cached);
  } catch (e) {}

  if (!topo) {
    const waits = [0, 400, 1200];
    outer:
    for (let attempt = 0; attempt < waits.length; attempt++) {
      if (waits[attempt]) await new Promise(r => setTimeout(r, waits[attempt]));
      for (const url of SOURCES) {
        try {
          topo = await d3.json(url);
          if (topo && topo.objects) break outer;
        } catch (e) {}
      }
    }
  }
  if (!topo || !topo.objects) { fallback(); return; }
  try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(topo)); } catch (e) {}
  let land;
  try { land = topojson.feature(topo, topo.objects.countries); } catch (e) { fallback(); return; }

  function draw(){
    el.innerHTML = '';
    const w = el.clientWidth, h = el.clientHeight;
    const view = { type:'MultiPoint', coordinates:[[-11.2,51.2],[-5.2,55.6]] };
    const proj = d3.geoMercator().fitSize([w,h], view);
    const path = d3.geoPath(proj);
    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${w} ${h}`);

    svg.append('rect').attr('width',w).attr('height',h).attr('fill','#E6E0D5');
    svg.append('g').selectAll('path').data(land.features).join('path')
      .attr('d', path).attr('fill','#FFFDF8').attr('stroke','#1A1C18').attr('stroke-width',0.8).attr('stroke-opacity',0.3);

    [80000, 160000, 240000].forEach(function(r){
      const circle = d3.geoCircle().center(HQ).radius(r / 6371000 * 180 / Math.PI)();
      svg.append('path').attr('d', path(circle))
        .attr('fill','#1A1C18').attr('fill-opacity',0.045)
        .attr('stroke','#1A1C18').attr('stroke-opacity',0.28).attr('stroke-width',1)
        .attr('stroke-dasharray','3 4');
    });

    const towns = [
      ['Shannon', -8.8639, 52.7122, '20 min', -10, 16, 'end'],
      ['Limerick', -8.6267, 52.6638, '40 min', 12, 5],
      ['Galway', -9.0568, 53.2707, '1 hr 05', -12, -12, 'end'],
      ['Athlone', -7.9407, 53.4239, '1 hr 40', 10, -4],
      ['Cork', -8.4756, 51.8985, '2 hr 05', 10, 4],
      ['Sligo', -8.4761, 54.2766, '2 hr 15', 10, 4]
    ];
    towns.forEach(function(t){
      const p = proj([t[1], t[2]]);
      svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',3.5).attr('fill','#A98750');
      const g = svg.append('text').attr('x',p[0]+t[4]).attr('y',p[1]+t[5])
        .attr('text-anchor', t[6] || 'start').attr('font-size',12.5).attr('fill','#16211C').attr('font-weight',600);
      g.append('tspan').text(t[0]);
      g.append('tspan').text(' · '+t[3]).attr('fill','#5A665F').attr('font-weight',400);
    });

    const p = proj(HQ);
    svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',8).attr('fill','#1A1C18').attr('stroke','#F1EDE6').attr('stroke-width',3.5);
    svg.append('text').attr('x',p[0]-14).attr('y',p[1]+5).attr('text-anchor','end')
      .attr('font-size',13.5).attr('font-weight',700).attr('fill','#1A1C18').text('ENNIS');

    svg.append('text').attr('x',16).attr('y',h-16).attr('font-size',11).attr('fill','#5A665F')
      .text('Rings at 80 km, 160 km and 240 km from the door');
  }

  function safeDraw(){ try { draw(); } catch (e) { fallback(); } }
  safeDraw();
  new ResizeObserver(safeDraw).observe(el);
})();
</script>
</body>
</html>
