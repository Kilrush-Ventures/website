<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map — Kilrush Ventures, V95 W63A, Ennis</title>
<style>
  html,body{margin:0;height:100%;background:#E6E0D5;font-family:"Manrope",ui-sans-serif,system-ui,sans-serif}
  #wrap{position:absolute;inset:0}
  iframe{display:block;width:100%;height:100%;border:0}
  .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#5A665F}
  .a{font-size:15px;line-height:1.5;color:#16211C;margin-top:7px}
  .btn{display:inline-block;background:#1A1C18;color:#F1EDE6;padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
  #card{position:absolute;left:14px;bottom:14px;max-width:260px;background:#F1EDE6;padding:16px 18px;box-shadow:0 10px 30px -12px rgba(22,33,28,.45)}
  #card .btn{margin-top:12px}
  #fb{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:4px;padding:clamp(24px,5vw,40px);background:#E6E0D5;box-sizing:border-box}
  #fb .a{font-size:19px}
  #fb .btn{margin-top:18px;align-self:flex-start}
  .failed #card,.failed iframe{display:none}
  .failed #fb{display:flex}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="mapframe"
    src="https://www.google.com/maps?q=V95+W63A&amp;z=15&amp;output=embed"
    title="Google map of Kilrush Ventures, V95 W63A, Ennis, Co. Clare"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen></iframe>
  <div id="card">
    <div class="k">Find us</div>
    <div class="a">Kilrush Ventures<br>V95 W63A<br>Ennis, Co. Clare</div>
    <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=V95+W63A" target="_blank" rel="noopener">Get directions</a>
  </div>
  <div id="fb">
    <div class="k">Find us</div>
    <div class="a">Kilrush Ventures<br>V95 W63A<br>Ennis, Co. Clare</div>
    <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=V95+W63A" target="_blank" rel="noopener">Open in Google Maps</a>
  </div>
</div>
<script>
(function(){
  var wrap = document.getElementById('wrap');
  var f = document.getElementById('mapframe');
  var settled = false;
  function fail(){ if (!settled) { settled = true; wrap.className = 'failed'; } }
  function ok(){ settled = true; }
  function check(){
    try {
      var d = f.contentDocument;
      if (d && (d.URL === 'about:blank' || !d.body || !d.body.innerHTML)) { fail(); return true; }
    } catch (e) { ok(); return true; }
    return false;
  }
  f.addEventListener('load', function(){ if (!check()) ok(); });
  f.addEventListener('error', fail);
  setTimeout(function(){ if (!check() && !settled) fail(); }, 3500);
})();
</script>
</body>
</html>
